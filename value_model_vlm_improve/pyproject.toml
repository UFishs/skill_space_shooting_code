[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-model-codebase"
version = "0.1.0"
description = "Conditional flow-matching value model for LeRobot-format datasets"
requires-python = ">=3.11"

dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",

  "lerobot==0.3.2",

  "timm==1.0.27",
  "transformers==5.8.1",
  "huggingface_hub==1.15.0",
  "datasets==3.6.0",
  "pyyaml==6.0.3",
  "pillow==12.2.0",
  "numpy==2.4.6",
  "tqdm==4.67.3",
  "safetensors==0.7.0",
  "wandb==0.27.0",
  "fastapi==0.136.1",
  "uvicorn[standard]==0.47.0",
  "python-multipart==0.0.29",

  "opencv-python==4.13.0.92",
  "matplotlib==3.10.9",
]

[tool.setuptools]
packages = [
  "value_model_codebase",
  "value_model_codebase.datasets",
  "value_model_codebase.models",
  "value_model_codebase.training",
  "value_model_codebase.inference",
  "value_model_codebase.utils",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
override-dependencies = [
  "torchvision==0.20.1",
]